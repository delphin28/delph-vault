services:
  backend:
    build: ./backend
    container_name: backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be configured}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://localhost:8443}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-strict}
    networks:
      - backend_network

  frontend:
    build: ./frontend
    container_name: frontend
    command: npm start
    environment:
      REACT_APP_API_URL: /api
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    networks:
      - frontend_network

  https:
    image: nginx:1.27-alpine
    container_name: delph-vault-https
    ports:
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - backend_network
      - frontend_network

volumes:
  frontend_node_modules:

networks:
  backend_network:
  frontend_network: